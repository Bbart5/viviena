<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Architektura — viviena</title>
		<style>
			:root {
				--bg: #f6f7f9;
				--surface: #ffffff;
				--surface-2: #eef0f4;
				--text: #1c2330;
				--text-muted: #5b6472;
				--border: #d9dee6;
				--link: #b9c2cf;
				--shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
				--accent: #2563eb;
				--why-bg: #fdf6e7;
				--why-border: #d97706;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #12151c;
					--surface: #1b2029;
					--surface-2: #232936;
					--text: #e6e9ef;
					--text-muted: #97a0ad;
					--border: #323a48;
					--link: #45506180;
					--shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
					--why-bg: #2a2417;
					--why-border: #b45309;
				}
			}
			:root[data-theme='light'] {
				--bg: #f6f7f9;
				--surface: #ffffff;
				--surface-2: #eef0f4;
				--text: #1c2330;
				--text-muted: #5b6472;
				--border: #d9dee6;
				--link: #b9c2cf;
				--shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
				--why-bg: #fdf6e7;
				--why-border: #d97706;
			}
			:root[data-theme='dark'] {
				--bg: #12151c;
				--surface: #1b2029;
				--surface-2: #232936;
				--text: #e6e9ef;
				--text-muted: #97a0ad;
				--border: #323a48;
				--link: #45506180;
				--shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
				--why-bg: #2a2417;
				--why-border: #b45309;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				height: 100%;
			}
			body {
				font-family:
					'Segoe UI',
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--bg);
				color: var(--text);
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			header {
				display: flex;
				align-items: center;
				gap: 16px;
				flex-wrap: wrap;
				padding: 10px 16px;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
				z-index: 5;
			}
			header h1 {
				font-size: 16px;
				font-weight: 700;
				white-space: nowrap;
			}
			header .sub {
				font-size: 12px;
				color: var(--text-muted);
				white-space: nowrap;
			}
			#search {
				flex: 1 1 180px;
				max-width: 340px;
				min-width: 140px;
				padding: 7px 12px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--bg);
				color: var(--text);
				font-size: 13px;
				outline: none;
			}
			#search:focus {
				border-color: var(--accent);
			}
			.controls {
				display: flex;
				gap: 6px;
				margin-left: auto;
			}
			.controls button {
				padding: 6px 10px;
				font-size: 12px;
				font-weight: 600;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--surface);
				color: var(--text);
				cursor: pointer;
				white-space: nowrap;
			}
			.controls button:hover {
				background: var(--surface-2);
			}
			#legend {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				align-items: center;
				padding: 8px 16px;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
				font-size: 12px;
			}
			#legend .chip {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 3px 10px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: var(--bg);
				cursor: pointer;
				user-select: none;
				color: var(--text);
			}
			#legend .chip .dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
			}
			#legend .chip.active {
				border-color: var(--accent);
				background: var(--surface-2);
				font-weight: 700;
			}
			#legend .hint {
				color: var(--text-muted);
				margin-left: auto;
			}
			#matchcount {
				color: var(--text-muted);
				font-size: 12px;
				white-space: nowrap;
			}
			main {
				flex: 1;
				position: relative;
				overflow: hidden;
			}
			#canvas {
				width: 100%;
				height: 100%;
				display: block;
				cursor: grab;
				touch-action: none;
			}
			#canvas.dragging {
				cursor: grabbing;
			}
			.node rect.card {
				fill: var(--surface);
				stroke: var(--border);
				stroke-width: 1;
				rx: 9;
				filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
			}
			.node.group rect.card {
				stroke-dasharray: 5 3;
			}
			.node.gen rect.card {
				fill: var(--surface-2);
				stroke-dasharray: 3 3;
			}
			.node.gen text {
				fill: var(--text-muted) !important;
			}
			.node.selected rect.card {
				stroke: var(--accent);
				stroke-width: 2;
			}
			.node.hit rect.card {
				stroke-width: 2;
			}
			.node.dim {
				opacity: 0.22;
			}
			.node {
				cursor: pointer;
			}
			.node text.name {
				font-size: 13px;
				font-weight: 600;
				fill: var(--text);
			}
			.node text.short {
				font-size: 10.5px;
				fill: var(--text-muted);
			}
			.node rect.tag {
				rx: 2.5;
			}
			path.edge {
				fill: none;
				stroke: var(--link);
				stroke-width: 1.4;
			}
			path.edge.dim {
				opacity: 0.15;
			}
			.toggle circle {
				fill: var(--surface-2);
				stroke: var(--border);
			}
			.toggle text {
				font-size: 11px;
				font-weight: 700;
				fill: var(--text-muted);
				text-anchor: middle;
			}
			.toggle:hover circle {
				stroke: var(--accent);
			}
			#panel {
				position: absolute;
				top: 12px;
				right: 12px;
				bottom: 12px;
				width: min(400px, calc(100vw - 24px));
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 14px;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
				padding: 18px;
				overflow-y: auto;
				display: none;
				z-index: 10;
			}
			#panel.open {
				display: block;
			}
			#panel .close {
				position: absolute;
				top: 10px;
				right: 12px;
				border: none;
				background: none;
				color: var(--text-muted);
				font-size: 20px;
				cursor: pointer;
				line-height: 1;
			}
			#panel .crumbs {
				font-size: 11px;
				color: var(--text-muted);
				word-break: break-all;
				margin-bottom: 6px;
			}
			#panel h2 {
				font-size: 17px;
				margin-bottom: 8px;
				word-break: break-word;
				padding-right: 20px;
			}
			#panel .cat {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.3px;
				padding: 3px 10px;
				border-radius: 999px;
				margin-bottom: 12px;
				background: var(--surface-2);
			}
			#panel .cat .dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
			}
			#panel .desc {
				font-size: 13.5px;
				line-height: 1.6;
				white-space: pre-line;
			}
			#panel .why {
				margin-top: 14px;
				padding: 10px 12px 10px 14px;
				background: var(--why-bg);
				border-left: 3px solid var(--why-border);
				border-radius: 0 8px 8px 0;
				font-size: 13px;
				line-height: 1.55;
			}
			#panel .why b {
				display: block;
				margin-bottom: 4px;
				font-size: 11.5px;
				letter-spacing: 0.4px;
				text-transform: uppercase;
				color: var(--why-border);
			}
			#panel .kids {
				margin-top: 14px;
				font-size: 12px;
				color: var(--text-muted);
			}
			footer {
				padding: 6px 16px;
				font-size: 11.5px;
				color: var(--text-muted);
				background: var(--surface);
				border-top: 1px solid var(--border);
				display: flex;
				gap: 14px;
				flex-wrap: wrap;
			}
			@media (max-width: 640px) {
				header h1 {
					font-size: 14px;
				}
				header .sub {
					display: none;
				}
				#legend .hint {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div>
				<h1>viviena — mapa architektury</h1>
				<div class="sub">
					SvelteKit 2 · Svelte 5 · Prisma 7 · Postgres · R2/MinIO · Tailwind 4 · Vercel
				</div>
			</div>
			<input id="search" type="search" placeholder="Szukaj: auth, upload, ISR, seed…" />
			<span id="matchcount"></span>
			<div class="controls">
				<button id="btn-expand" title="Rozwiń wszystkie gałęzie">Rozwiń</button>
				<button id="btn-collapse" title="Zwiń do 2 poziomów">Zwiń</button>
				<button id="btn-fit" title="Dopasuj całość do okna">Dopasuj</button>
				<button id="btn-zoom-out">−</button>
				<button id="btn-zoom-in">+</button>
				<button id="btn-theme" title="Przełącz motyw">◐</button>
			</div>
		</header>
		<div id="legend"></div>
		<main>
			<svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
			<aside id="panel">
				<button class="close" title="Zamknij">×</button>
				<div class="crumbs"></div>
				<h2></h2>
				<span class="cat"></span>
				<p class="desc"></p>
				<div class="why" hidden><b>Dlaczego tak?</b><span></span></div>
				<div class="kids"></div>
			</aside>
		</main>
		<footer>
			<span>🖱 przeciągnij = przesuwanie</span>
			<span>scroll = zoom</span>
			<span>klik węzła = szczegóły</span>
			<span>⊕ / ⊖ = zwijanie gałęzi</span>
			<span>klik kategorii w legendzie = filtr</span>
		</footer>
		<script>
			'use strict';

			/* ---------------------------------- kategorie --------------------------------- */
			const CATS = {

								n: 'encode-users.ts + users.json',
								c: 'config',
								s: 'kodowanie kont adminów',
								d: 'CLI: users.json (gitignorowany — zawiera prawdziwe hasła) → base64 JSON do zmiennej SEED_USERS, którą konsumuje prisma/seed.ts.',
								w: 'Repo nie może zawierać haseł, a seed musi skądś dostać konta adminów — stąd zakodowana zmienna środowiskowa zamiast pliku w repo.'
							},
							{
								n: 'prisma.config.ts',
								c: 'config',
								s: 'konfiguracja Prisma CLI',
								d: 'Wskazuje katalog prisma/ jako schemę (multi-file), ścieżkę migracji i komendę seed (tsx prisma/seed.ts); URL bazy z env.'
							}
						]
					},
					{
						n: 'dokumentacja i design',
						c: 'docs',
						g: true,
						s: 'README + archiwum projektowe',
						d: 'Dokumenty w korzeniu repozytorium.',
						k: [
							{
								n: 'README.md',
								c: 'docs',
								s: 'setup, architektura, deploy',
								d: 'Instrukcja pierwszego uruchomienia krok po kroku, notatki architektoniczne (remote functions, REST-owe wyjątki, auth, media) i procedura deploymentu na Vercel. Najlepszy punkt startowy dla nowej osoby.'
							},
							{
								n: 'DESIGN.md / REFERENCE.html / TAILWIND_SPEC.md',
								c: 'docs',
								s: 'archiwum projektowe (Stitch)',
								d: 'Pierwotne mockupy i wytyczne designu wygenerowane w Google Stitch na początku projektu. Materiał archiwalny — już nieżywy; obowiązuje to, co jest zaimplementowane w kodzie.'
							}
						]
					},
					{
						n: 'generowane (poza gitem)',
						c: 'generated',
						g: true,
						s: 'artefakty buildów',
						d: 'Katalogi tworzone przez narzędzia — wszystkie gitignorowane. Na świeżym klonie odtwarzają je skrypty prepare / build.',
						k: [
							{
								n: 'generated/',
								c: 'generated',
								s: 'klient Prismy',
								d: 'Wygenerowany klient Prismy (output z schema.prisma). Powstaje przy prisma generate — dlatego prepare i build muszą go tworzyć przed startem Vite.'
							},
							{
								n: '.svelte-kit/',
								c: 'generated',
								s: 'artefakty svelte-kit sync',
								d: 'Typy tras, wygenerowany tsconfig (extends’owany przez główny tsconfig.json) i artefakty dev/builda.'
							},
							{
								n: '.vercel/',
								c: 'generated',
								s: 'output builda Vercel',
								d: 'Lokalny output builda w formacie Vercel (adapter).'
							},
							{
								n: 'node_modules/',
								c: 'generated',
								s: 'zależności npm',
								d: 'Zależności instalowane przez npm install.'
							}
						]
					}
				]
			};

			/* --------------------------------- stan + init --------------------------------- */
			const NODE_W = 252,
				NODE_H = 46,
				COL = 316,
				ROW = 58;
			const byId = new Map();
			(function init(node, parent, depth) {
				node.id = parent ? parent.id + '/' + node.n : node.n;
				node.parent = parent;
				node.depth = depth;
				byId.set(node.id, node);
				(node.k || []).forEach((c) => init(c, node, depth + 1));
			})(TREE, null, 0);

			let collapsed = new Set();
			let selectedId = null;
			let queryText = '';
			let activeCat = null;
			let view = { x: 60, y: 60, k: 1 };

			function defaultCollapse() {
				collapsed = new Set();
				byId.forEach((n) => {
					if (n.depth >= 2 && n.k && n.k.length) collapsed.add(n.id);
				});
			}
			defaultCollapse();

			/* ---------------------------------- filtrowanie -------------------------------- */
			function nodeMatches(n, q) {
				if (activeCat && n.c !== activeCat) return false;
				if (!q) return true;
				const hay = (n.n + ' ' + (n.s || '') + ' ' + (n.d || '') + ' ' + (n.w || '')).toLowerCase();
				return hay.includes(q);
			}
			function computeMatches() {
				const q = queryText.trim().toLowerCase();
				if (!q && !activeCat) return null;
				const set = new Set();
				byId.forEach((n) => {
					if (nodeMatches(n, q)) set.add(n.id);
				});
				// rozwiń przodków trafień, żeby były widoczne
				set.forEach((id) => {
					let p = byId.get(id).parent;
					while (p) {
						collapsed.delete(p.id);
						p = p.parent;
					}
				});
				return set;
			}

			/* ------------------------------------ layout ----------------------------------- */
			function layoutTree() {
				const nodes = [],
					links = [];
				let slot = 0;
				(function walk(n) {
					n.x = n.depth * COL;
					const open = n.k && n.k.length && !collapsed.has(n.id);
					if (open) {
						n.k.forEach(walk);
						n.y = (n.k[0].y + n.k[n.k.length - 1].y) / 2;
						n.k.forEach((c) => links.push([n, c]));
					} else {
						n.y = slot * ROW;
						slot += 1;
					}
					nodes.push(n);
				})(TREE);
				return { nodes, links };
			}

			/* ------------------------------------ render ----------------------------------- */
			const world = document.getElementById('world');
			const canvas = document.getElementById('canvas');
			const esc = (s) =>
				String(s)
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;');
			const trunc = (s, max) => (s.length > max ? s.slice(0, max - 1) + '…' : s);

			function render() {
				const matches = computeMatches();
				const { nodes, links } = layoutTree();
				let svg = '';
				for (const [a, b] of links) {
					const x1 = a.x + NODE_W,
						y1 = a.y + NODE_H / 2,
						x2 = b.x,
						y2 = b.y + NODE_H / 2;
					const mx = (x1 + x2) / 2;
					const dim = matches && !(matches.has(a.id) || matches.has(b.id));
					svg += `<path class="edge${dim ? ' dim' : ''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
				}
				for (const n of nodes) {
					const color = CATS[n.c].color;
					const cls = ['node'];
					if (n.g) cls.push('group');
					if (n.c === 'generated') cls.push('gen');
					if (n.id === selectedId) cls.push('selected');
					if (matches) cls.push(matches.has(n.id) ? 'hit' : 'dim');
					const hit = matches && matches.has(n.id);
					svg += `<g class="${cls.join(' ')}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})">`;
					svg += `<rect class="card" width="${NODE_W}" height="${NODE_H}" rx="9"${hit ? ` stroke="${color}"` : ''}/>`;
					svg += `<rect class="tag" x="0" y="8" width="4" height="${NODE_H - 16}" fill="${color}"/>`;
					svg += `<text class="name" x="14" y="19">${esc(trunc(n.n, 31))}</text>`;
					if (n.s) svg += `<text class="short" x="14" y="35">${esc(trunc(n.s, 40))}</text>`;
					if (n.k && n.k.length) {
						const isCollapsed = collapsed.has(n.id);
						svg += `<g class="toggle" data-toggle="${esc(n.id)}" transform="translate(${NODE_W},${NODE_H / 2})">`;
						svg += `<circle r="10"/>`;
						svg += `<text y="3.5">${isCollapsed ? n.k.length : '−'}</text></g>`;
					}
					svg += `</g>`;
				}
				world.innerHTML = svg;
				const count = document.getElementById('matchcount');
				count.textContent = matches ? `${matches.size} trafień` : '';
				applyView();
			}

			function applyView() {
				world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
			}

			/* ------------------------------- panel szczegółów ------------------------------ */
			const panel = document.getElementById('panel');
			function openPanel(n) {
				const crumbs = [];
				let p = n;
				while (p) {
					crumbs.unshift(p.n);
					p = p.parent;
				}
				panel.querySelector('.crumbs').textContent = crumbs.join(' › ');
				panel.querySelector('h2').textContent = n.n;
				const cat = panel.querySelector('.cat');
				cat.innerHTML = `<span class="dot" style="background:${CATS[n.c].color}"></span>${esc(CATS[n.c].label)}${n.g ? ' · grupa' : ''}`;
				panel.querySelector('.desc').textContent = n.d || n.s || '';
				const why = panel.querySelector('.why');
				if (n.w) {
					why.hidden = false;
					why.querySelector('span').textContent = n.w;
				} else {
					why.hidden = true;
				}
				panel.querySelector('.kids').textContent =
					n.k && n.k.length
						? `Zawiera ${n.k.length} ${n.k.length === 1 ? 'element' : n.k.length < 5 ? 'elementy' : 'elementów'}: ${n.k.map((c) => c.n).join(', ')}`
						: '';
				panel.classList.add('open');
			}
			panel.querySelector('.close').addEventListener('click', () => {
				panel.classList.remove('open');
				selectedId = null;
				render();
			});

			/* ---------------------------------- interakcje --------------------------------- */
			canvas.addEventListener('click', (e) => {
				const toggle = e.target.closest('[data-toggle]');
				if (toggle) {
					const id = toggle.getAttribute('data-toggle');
					if (collapsed.has(id)) collapsed.delete(id);
					else collapsed.add(id);
					render();
					return;
				}
				const g = e.target.closest('[data-id]');
				if (g) {
					selectedId = g.getAttribute('data-id');
					openPanel(byId.get(selectedId));
					render();
				}
			});

			let dragging = false,
				moved = false,
				last = null;
			canvas.addEventListener('pointerdown', (e) => {
				dragging = true;
				moved = false;
				last = { x: e.clientX, y: e.clientY };
			});
			canvas.addEventListener('pointermove', (e) => {
				if (!dragging) return;
				const dx = e.clientX - last.x,
					dy = e.clientY - last.y;
				// Capture only once a real drag starts: capturing in pointerdown
				// makes the browser retarget the subsequent click to the canvas,
				// which swallowed node clicks.
				if (!moved && Math.abs(dx) + Math.abs(dy) > 3) {
					moved = true;
					canvas.classList.add('dragging');
					try {
						canvas.setPointerCapture(e.pointerId);
					} catch {
						// pointer gone mid-gesture (e.g. pen lifted) - pan still works
					}
				}
				if (!moved) return;
				view.x += dx;
				view.y += dy;
				last = { x: e.clientX, y: e.clientY };
				applyView();
			});
			canvas.addEventListener('pointerup', () => {
				dragging = false;
				canvas.classList.remove('dragging');
			});
			canvas.addEventListener(
				'click',
				(e) => {
					if (moved) {
						e.stopImmediatePropagation();
						moved = false;
					}
				},
				true
			);

			canvas.addEventListener(
				'wheel',
				(e) => {
					e.preventDefault();
					const rect = canvas.getBoundingClientRect();
					const mx = e.clientX - rect.left,
						my = e.clientY - rect.top;
					const factor = Math.exp(-e.deltaY * 0.0012);
					const k = Math.min(2.5, Math.max(0.15, view.k * factor));
					view.x = mx - ((mx - view.x) / view.k) * k;
					view.y = my - ((my - view.y) / view.k) * k;
					view.k = k;
					applyView();
				},
				{ passive: false }
			);

			function zoomBy(factor) {
				const rect = canvas.getBoundingClientRect();
				const mx = rect.width / 2,
					my = rect.height / 2;
				const k = Math.min(2.5, Math.max(0.15, view.k * factor));
				view.x = mx - ((mx - view.x) / view.k) * k;
				view.y = my - ((my - view.y) / view.k) * k;
				view.k = k;
				applyView();
			}

			function fit() {
				const { nodes } = layoutTree();
				let minX = Infinity,
					minY = Infinity,
					maxX = -Infinity,
					maxY = -Infinity;
				for (const n of nodes) {
					minX = Math.min(minX, n.x);
					minY = Math.min(minY, n.y);
					maxX = Math.max(maxX, n.x + NODE_W + 20);
					maxY = Math.max(maxY, n.y + NODE_H);
				}
				const rect = canvas.getBoundingClientRect();
				const pad = 40;
				const k = Math.min(
					1.15,
					(rect.width - pad * 2) / (maxX - minX),
					(rect.height - pad * 2) / (maxY - minY)
				);
				view.k = Math.max(0.12, k);
				view.x = (rect.width - (maxX - minX) * view.k) / 2 - minX * view.k;
				view.y = (rect.height - (maxY - minY) * view.k) / 2 - minY * view.k;
				applyView();
			}

			document.getElementById('btn-zoom-in').addEventListener('click', () => zoomBy(1.25));
			document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(0.8));
			document.getElementById('btn-fit').addEventListener('click', fit);
			document.getElementById('btn-expand').addEventListener('click', () => {
				collapsed.clear();
				render();
				fit();
			});
			document.getElementById('btn-collapse').addEventListener('click', () => {
				defaultCollapse();
				render();
				fit();
			});
			document.getElementById('btn-theme').addEventListener('click', () => {
				const root = document.documentElement;
				const dark = matchMedia('(prefers-color-scheme: dark)').matches;
				const cur = root.dataset.theme || (dark ? 'dark' : 'light');
				root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
			});

			const searchEl = document.getElementById('search');
			searchEl.addEventListener('input', () => {
				queryText = searchEl.value;
				render();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') {
					if (queryText) {
						queryText = '';
						searchEl.value = '';
					}
					activeCat = null;
					panel.classList.remove('open');
					selectedId = null;
					renderLegend();
					render();
				}
			});

			/* ----------------------------------- legenda ----------------------------------- */
			const legendEl = document.getElementById('legend');
			function renderLegend() {
				legendEl.innerHTML =
					Object.entries(CATS)
						.map(
							([key, c]) =>
								`<span class="chip${activeCat === key ? ' active' : ''}" data-cat="${key}"><span class="dot" style="background:${c.color}"></span>${esc(c.label)}</span>`
						)
						.join('') + `<span class="hint">Esc czyści filtry i zaznaczenie</span>`;
			}
			legendEl.addEventListener('click', (e) => {
				const chip = e.target.closest('[data-cat]');
				if (!chip) return;
				const cat = chip.getAttribute('data-cat');
				activeCat = activeCat === cat ? null : cat;
				renderLegend();
				render();
			});

			/* ------------------------------------ start ------------------------------------ */
			renderLegend();
			render();
			fit();
			addEventListener('resize', fit);
		</script>
	</body>
</html>
